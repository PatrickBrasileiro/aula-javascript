<script>

let numeroInicio = Number(prompt(`Digite o número inicial:`));

// no while eu coloco a variavel que vai receber o numero geralmente o numero vai ser maior do que zero, então tenho que fazer > que 0 e decrementar


while(numeroInicio >= 0){
    console.log(numeroInicio);
    numeroInicio--;
}





</script>
