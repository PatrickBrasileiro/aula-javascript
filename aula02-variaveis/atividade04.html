<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 02 - Atividade 04</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="alert alert-primary" role="alert"><h2>Aula 2 - Atividade 04</h2></div>


    <script>

        let nome = prompt('Digite seu nome:', '');
        let cor = prompt('Digite a cor desejada: ', '');

        document.body.style.backgroundColor= cor;
        
        document.write(`
        <h1 <div class="p-3 mb-2 bg-body-secondary text-black"></div>
            
            <br>Cor de fundo da página:<br>
            Olá, ${nome}, você definiu como: ${cor} a cor de fundo da página <br>
        
        </h1>
        `)



    </script>











    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
