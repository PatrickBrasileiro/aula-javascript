<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>

let n1 = Number(prompt(`Digite o numero`,''));
let res = n1 % 2;


if(res === 0){
    document.write(`Número digitado: ${n1}<br>
    classificação: Par
    `)
} else {
       document.write(`Número digitado: ${n1}<br>
    classificação: Impar
    `)
}

</script>


</body>
</html>
