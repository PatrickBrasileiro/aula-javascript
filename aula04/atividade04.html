<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio de Correção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body class="bg-light">
    
    <script>
      const nomeAluno = prompt("Digite o nome do aluno:");
      const nota1 = Number(prompt("Digite a primeira nota:"));
      const nota2 = Number(prompt("Digite a segunda nota:"));

      const media = (nota1 + nota2) / 2;
      let situacao = "";
      let classeResultado = "";

      if (media >= 7) {
        situacao = "Aprovado";
        classeResultado = "success";
      } else if (media <5) {
        situacao = "Reprovado";
        classeResultado = "warning";
      } else {
        situacao = "Recuperação";
        classeResultado = "danger";
        
        console.log(`Aluno: ${nomeAluno}
        Primeira nota: ${nota1}
        Segunda nota: ${nota2}
        Média: ${media.toFixed(2)} 
        Situação: ${situacao} 
          `);
      }

      document.write(` <main class="container py-5"> 
        <div class="card shadow"> <div class="card-header bg-primary text-white"> <h1 class="h4 mb-0">Resultado do aluno</h1> </div> 
        
        <div class="card-body"> 
        
        <p><strong>Aluno:</strong> ${nomeAluno}</p> 
        <p><strong>Primeira nota:</strong> ${nota1}</p> 
        <p><strong>Segunda nota:</strong> ${nota2}</p> 
        <p><strong>Média:</strong> ${media.toFixed(2)}</p> 
        
        <div class="alert alert-classeResultado"> <strong>Situação:</strong> ${situacao} </div> 
        </div> 
        </div> 
        </main> 
        `,);

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
