<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade05</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="d-block p-2 text-bg-primary">
        <h1>Atividade 05</h1>
    </div>

    <script>

        nome = prompt('Digite o seu nome', '');
        curso = prompt('Digite o seu curso', '');
        professor = prompt('Digite o nome do seu professor', '');

        document.write('<h2 class="h4 pb-2 mb-4 text-danger border-bottom border-danger"> Informações de cadastro: </h2>');


        document.write('<h4 class="border border-success p-2 mb-2"> Nome:  ' + nome + ' </h4>');
        document.write('<h4 class="border border-success p-2 mb-2"> Curso:  ' + curso + ' </h4>');
        document.write('<h4 class="border border-success p-2 mb-2"> Professor:  ' + professor + ' </h4>');

        console.log('Informação Registrada:' + nome);
        console.log('Informação Registrada:' + curso);
        console.log('Informação Registrada:' + professor);


    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
